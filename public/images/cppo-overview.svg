<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="cppo-title cppo-desc">
  <title id="cppo-title">CPPO: coordinated exploration within a fixed K-attempt budget</title>
  <desc id="cppo-desc">A planner produces a tuple of K distinct high-level strategies. The abbreviated tuple shows Strategy 1, Strategy 2, omitted strategies, and Strategy K. All strategies go to the same shared solver, which attempts one code solution per strategy. The resulting solutions go to a verifier, using a total of K solver attempts. This is a conceptual method schematic, not a performance figure or a device execution diagram.</desc>
  <defs>
    <marker id="cppo-arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5.5 L 1 10" fill="none" stroke="#39766a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="cppo-arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5.5 L 1 10" fill="none" stroke="#e4a26a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="cppo-arrow-evergreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5.5 L 1 10" fill="none" stroke="#142d2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f7f8f4"/>
  <g aria-hidden="true" fill="none" stroke="#dce5d8">
    <path d="M 616 0 C 712 112 850 108 900 197" stroke-width="1.5"/>
    <path d="M 654 0 C 744 86 868 91 900 152" stroke-width="1.5"/>
    <path d="M 696 0 C 775 59 881 66 900 110" stroke-width="1.5"/>
    <path d="M 53 446 H 847" stroke-width="1.5"/>
    <path d="M 242 145 V 428 M 504 145 V 428 M 728 145 V 428" stroke-width="1" stroke-dasharray="3 10" opacity="0.65"/>
  </g>

  <g font-family="sans-serif" fill="#142d2a">
    <text x="54" y="80" font-size="38" font-weight="600" letter-spacing="-1">CPPO</text>
    <rect x="488" y="42" width="358" height="54" rx="27" fill="#ebf0e8"/>
    <circle cx="515" cy="69" r="5" fill="#e4a26a"/>
    <text x="538" y="79" font-size="27">Fixed K-attempt budget</text>
  </g>

  <!-- Echo lines give each strategy a distinct routing lane. -->
  <g aria-hidden="true" fill="none" stroke="#dce5d8" stroke-width="2" stroke-linecap="round">
    <path d="M 203 281 C 237 281 230 183 275 183"/>
    <path d="M 203 299 C 237 299 236 298 275 298"/>
    <path d="M 203 309 C 239 309 228 413 275 413"/>
    <path d="M 461 183 C 492 183 510 183 539 183"/>
    <path d="M 461 298 C 491 298 510 298 539 298"/>
    <path d="M 461 413 C 491 413 510 413 539 413"/>
    <path d="M 701 183 C 743 183 737 239 762 248"/>
    <path d="M 701 298 H 752"/>
    <path d="M 701 413 C 744 413 738 335 765 325"/>
  </g>

  <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 202 291 C 240 291 229 193 274 193" stroke="#39766a" marker-end="url(#cppo-arrow-teal)"/>
    <path d="M 202 291 C 237 291 238 288 274 288" stroke="#e4a26a" marker-end="url(#cppo-arrow-orange)"/>
    <path d="M 202 291 C 240 291 229 403 274 403" stroke="#142d2a" marker-end="url(#cppo-arrow-evergreen)"/>
    <path d="M 461 193 H 538" stroke="#39766a" marker-end="url(#cppo-arrow-teal)"/>
    <path d="M 461 288 H 538" stroke="#e4a26a" marker-end="url(#cppo-arrow-orange)"/>
    <path d="M 461 403 H 538" stroke="#142d2a" marker-end="url(#cppo-arrow-evergreen)"/>
    <path d="M 700 193 C 742 193 737 249 764 259" stroke="#39766a" marker-end="url(#cppo-arrow-teal)"/>
    <path d="M 700 288 H 754" stroke="#e4a26a" marker-end="url(#cppo-arrow-orange)"/>
    <path d="M 700 403 C 742 403 738 325 766 317" stroke="#142d2a" marker-end="url(#cppo-arrow-evergreen)"/>
  </g>

  <g font-family="sans-serif" fill="#142d2a">
    <rect x="54" y="234" width="148" height="114" rx="20" fill="#ebf0e8" stroke="#142d2a" stroke-width="2"/>
    <g aria-hidden="true" fill="none" stroke="#39766a" stroke-width="3" stroke-linecap="round">
      <path d="M 105 268 H 153 M 105 280 H 142 M 105 292 H 160"/>
      <circle cx="93" cy="268" r="2" fill="#39766a" stroke="none"/>
      <circle cx="93" cy="280" r="2" fill="#e4a26a" stroke="none"/>
      <circle cx="93" cy="292" r="2" fill="#142d2a" stroke="none"/>
    </g>
    <text x="128" y="326" text-anchor="middle" font-size="30" font-weight="500">Planner</text>

    <rect x="276" y="159" width="185" height="68" rx="15" fill="#ebf0e8" stroke="#39766a" stroke-width="2"/>
    <path d="M 293 178 V 208" fill="none" stroke="#39766a" stroke-width="5" stroke-linecap="round"/>
    <text x="376" y="203" text-anchor="middle" font-size="28">Strategy 1</text>

    <rect x="276" y="254" width="185" height="68" rx="15" fill="#f4e6d8" stroke="#e4a26a" stroke-width="2"/>
    <path d="M 293 273 V 303" fill="none" stroke="#e4a26a" stroke-width="5" stroke-linecap="round"/>
    <text x="376" y="298" text-anchor="middle" font-size="28">Strategy 2</text>

    <g aria-hidden="true" fill="#39766a">
      <circle cx="350" cy="346" r="3"/>
      <circle cx="369" cy="346" r="3"/>
      <circle cx="388" cy="346" r="3"/>
    </g>

    <rect x="276" y="369" width="185" height="68" rx="15" fill="#dce5d8" stroke="#142d2a" stroke-width="2"/>
    <path d="M 293 388 V 418" fill="none" stroke="#142d2a" stroke-width="5" stroke-linecap="round"/>
    <text x="376" y="413" text-anchor="middle" font-size="28">Strategy K</text>

    <rect x="540" y="159" width="160" height="278" rx="22" fill="#142d2a"/>
    <text x="620" y="212" text-anchor="middle" font-size="31" font-weight="500" fill="#f7f8f4">Shared</text>
    <text x="620" y="251" text-anchor="middle" font-size="31" font-weight="500" fill="#f7f8f4">solver</text>
    <g aria-hidden="true">
      <rect x="586" y="298" width="76" height="96" rx="10" fill="#39766a"/>
      <rect x="574" y="309" width="76" height="96" rx="10" fill="#24453e" stroke="#9ab8a7" stroke-width="1.5"/>
      <g fill="none" stroke="#dce5d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 593 335 L 585 343 L 593 351 M 632 335 L 640 343 L 632 351 M 618 331 L 609 355"/>
        <path d="M 590 372 H 633 M 590 383 H 617"/>
      </g>
      <circle cx="629" cy="383" r="3" fill="#e4a26a"/>
    </g>

    <circle cx="805" cy="288" r="49" fill="#ebf0e8" stroke="#142d2a" stroke-width="2"/>
    <g aria-hidden="true" fill="none" stroke="#39766a" stroke-width="4" stroke-linecap="round">
      <circle cx="801" cy="282" r="16"/>
      <path d="M 813 295 L 826 308"/>
      <path d="M 794 282 H 808" stroke-width="2.5"/>
      <path d="M 801 275 V 289" stroke-width="2.5"/>
    </g>
    <text x="805" y="375" text-anchor="middle" font-size="29" font-weight="500">Verifier</text>

    <text x="54" y="503" font-size="29" font-weight="500">One attempt per strategy</text>
    <g aria-hidden="true">
      <circle cx="781" cy="493" r="6" fill="#39766a"/>
      <circle cx="810" cy="493" r="6" fill="#e4a26a"/>
      <circle cx="839" cy="493" r="6" fill="#142d2a"/>
    </g>
  </g>
</svg>
