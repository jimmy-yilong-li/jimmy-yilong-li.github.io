<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="kv-branches-mobile-title kv-branches-mobile-desc">
  <title id="kv-branches-mobile-title">Completed history with private answer branches</title>
  <desc id="kv-branches-mobile-desc">Completed causal video history forms an immutable prefix. Question A branches down from that completed prefix into a private suffix and Answer A. Only the shared history continues down the left-hand spine: new frames yield a later completed prefix, from which Question B branches into a private suffix and Answer B. The earlier prefix remains unchanged. The dashed pending next frame is not ready and is excluded from both ready branch views. Independently computed answer tails never merge into shared history or each other, and earlier answers never observe new frames. Segments are schematic, not frame counts or durations.</desc>
  <defs>
    <marker id="kv-branches-mobile-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#39766a"/>
    </marker>
  </defs>
  <rect width="480" height="720" fill="#f7f8f4"/>
  <!-- The continuation spine bypasses both private answer cards. -->
  <g aria-hidden="true" fill="none" stroke="#39766a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#kv-branches-mobile-arrow)">
    <path d="M 52 174 H 28 V 436 H 50"/>
    <path d="M 286 220 V 242"/>
    <path d="M 286 482 V 504"/>
    <path d="M 52 360 H 30"/>
  </g>
  <g aria-hidden="true">
    <rect x="52" y="128" width="376" height="92" rx="14" fill="#39766a"/>
    <rect x="74" y="144" width="76" height="10" rx="3" fill="#dce5d8"/>
    <rect x="158" y="144" width="76" height="10" rx="3" fill="#dce5d8"/>
    <rect x="242" y="144" width="76" height="10" rx="3" fill="#dce5d8"/>
    <rect x="146" y="244" width="282" height="84" rx="12" fill="#dce5d8"/>
    <rect x="52" y="348" width="24" height="24" rx="4" fill="#e4a26a" stroke="#142d2a" stroke-width="1.5"/>
    <rect x="52" y="390" width="376" height="92" rx="14" fill="#39766a"/>
    <rect x="74" y="406" width="76" height="10" rx="3" fill="#dce5d8"/>
    <rect x="158" y="406" width="76" height="10" rx="3" fill="#dce5d8"/>
    <rect x="242" y="406" width="76" height="10" rx="3" fill="#dce5d8"/>
    <rect x="326" y="406" width="80" height="10" rx="3" fill="#e4a26a"/>
    <rect x="146" y="506" width="282" height="84" rx="12" fill="#dce5d8"/>
    <path d="M 52 436 H 28 V 642 H 52" fill="none" stroke="#142d2a" stroke-width="1.5" stroke-dasharray="5 6"/>
    <rect x="52" y="612" width="376" height="64" rx="12" fill="#f7f8f4" stroke="#142d2a" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>
  <g font-family="sans-serif" fill="#142d2a">
    <text x="24" y="54" font-size="32" font-weight="600" letter-spacing="-0.5">One history.</text>
    <text x="24" y="92" font-size="32" font-weight="600" letter-spacing="-0.5">Private branches.</text>
    <text x="74" y="182" font-size="26" font-weight="600" fill="#f7f8f4">Completed prefix</text>
    <text x="74" y="209" font-size="22" fill="#f7f8f4">Immutable video history</text>
    <text x="166" y="276" font-size="24" font-weight="600">Question A</text>
    <text x="166" y="308" font-size="22">Private suffix / Answer A</text>
    <text x="90" y="368" font-size="22">New frames</text>
    <text x="74" y="444" font-size="26" font-weight="600" fill="#f7f8f4">Later completed prefix</text>
    <text x="74" y="471" font-size="22" fill="#f7f8f4">History + new frames</text>
    <text x="166" y="538" font-size="24" font-weight="600">Question B</text>
    <text x="166" y="570" font-size="22">Private suffix / Answer B</text>
    <text x="74" y="639" font-size="22">Next frame pending</text>
    <text x="74" y="665" font-size="22">Not ready / excluded</text>
    <text x="24" y="708" font-size="22">Pending frames are in neither view.</text>
  </g>
</svg>
