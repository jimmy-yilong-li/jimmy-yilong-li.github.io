  <path d="M450 44V475" stroke="#dce5d8" stroke-width="2"/>
  <g font-family="sans-serif" fill="#142d2a">
    <text x="48" y="53" font-size="17" letter-spacing="2" fill="#54645e">01 / FIXED CAPACITY</text>
    <text x="490" y="53" font-size="17" letter-spacing="2" fill="#54645e">02 / EVOLVING CAPACITY</text>
    <text x="48" y="99" font-size="34" font-weight="600">Speed wins.</text>
    <text x="490" y="99" font-size="34" font-weight="600">Acceleration wins.</text>
    <text x="83" y="149" font-size="19">Development Speed</text>
    <text x="525" y="149" font-size="19">Development Speed</text>
