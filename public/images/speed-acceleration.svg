    <circle cx="526" cy="365" r="5" fill="#142d2a"/>
    <text x="105" y="213" font-size="19" fill="#2463a0">Faster team</text>
    <text x="105" y="315" font-size="19" fill="#ad4c42">Slower team</text>
    <text x="638" y="203" font-size="19" fill="#2463a0">Product + loop</text>
