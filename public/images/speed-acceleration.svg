<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="accel-title accel-desc">
  <title id="accel-title">Speed wins. Acceleration wins.</title>
  <desc id="accel-desc">Two conceptual charts show development speed over time, with illustrative fluctuations rather than measured data. Left: blue and dashed red traces fluctuate around higher and lower speeds. Right: both start at the same speed; despite local setbacks, the blue product-and-loop trace rises increasingly fast while the red product-only trace rises slowly. These are conceptual trends, not guaranteed outcomes or unlimited growth.</desc>
