<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720" viewBox="0 0 480 720" role="img" aria-labelledby="kv-reuse-mobile-title kv-reuse-mobile-desc">
  <title id="kv-reuse-mobile-title">Two cache layers skip different work</title>
  <desc id="kv-reuse-mobile-desc">Three stacked routes run from image through vision and projection to visual embeddings, historical LM prefill, prefix KV, query suffix prefill, and decode. Read each route from top to bottom, following the arrows within each line. An embeddings hit skips visual work but still needs historical LM prefill to produce contextual prefix KV. A prefix KV hit also skips historical LM prefill. Neither hit skips query suffix prefill or decode. Visual embeddings are not contextual KV. Query is short for query suffix prefill. This is a schematic, not a duration comparison.</desc>
  <defs>
    <marker id="kv-reuse-mobile-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#39766a"/>
    </marker>
  </defs>
  <rect width="480" height="720" fill="#f7f8f4"/>
  <g aria-hidden="true" fill="none" stroke="#dce5d8" stroke-width="1.5">
    <rect x="24" y="104" width="432" height="194" rx="16"/>
    <rect x="24" y="316" width="432" height="178" rx="16"/>
    <rect x="24" y="512" width="432" height="120" rx="16"/>
  </g>
  <g aria-hidden="true">
    <rect x="148" y="154" width="272" height="36" rx="7" fill="#e4a26a"/>
    <rect x="40" y="242" width="114" height="36" rx="7" fill="#dce5d8"/>
    <rect x="40" y="402" width="154" height="36" rx="7" fill="#39766a"/>
    <rect x="40" y="446" width="114" height="36" rx="7" fill="#dce5d8"/>
    <rect x="40" y="590" width="114" height="36" rx="7" fill="#39766a"/>
  </g>
  <g font-family="sans-serif" fill="#142d2a">
    <text x="24" y="48" font-size="32" font-weight="600" letter-spacing="-0.5">Reuse the right layer.</text>
    <text x="24" y="80" font-size="22">Two caches. Different saved work.</text>

    <text x="48" y="140" font-size="26" font-weight="600">No cache</text>
    <text x="48" y="180" font-size="22">Image</text>
    <text x="160" y="180" font-size="22">Vision + projection</text>
    <text x="48" y="224" font-size="22">Embeddings</text>
    <text x="232" y="224" font-size="22">History prefill</text>
    <text x="48" y="268" font-size="22">Prefix KV</text>
    <text x="210" y="268" font-size="22">Query</text>
    <text x="350" y="268" font-size="22">Decode</text>

    <text x="48" y="352" font-size="26" font-weight="600">Embeddings hit</text>
    <text x="48" y="386" font-size="22">Skip visual work</text>
    <text x="48" y="428" font-size="22" fill="#f7f8f4">Embeddings</text>
    <text x="244" y="428" font-size="22">History prefill</text>
    <text x="48" y="472" font-size="22">Prefix KV</text>
    <text x="210" y="472" font-size="22">Query</text>
    <text x="350" y="472" font-size="22">Decode</text>

    <text x="48" y="548" font-size="26" font-weight="600">Prefix KV hit</text>
    <text x="48" y="580" font-size="22">Skip visual work + history prefill</text>
    <text x="48" y="616" font-size="22" fill="#f7f8f4">Prefix KV</text>
    <text x="210" y="616" font-size="22">Query</text>
    <text x="350" y="616" font-size="22">Decode</text>

    <text x="24" y="670" font-size="22">Query = suffix prefill.</text>
    <text x="24" y="702" font-size="22">Every route still decodes.</text>
  </g>
  <g aria-hidden="true" fill="none" stroke="#39766a" stroke-width="2" marker-end="url(#kv-reuse-mobile-arrow)">
    <path d="M 116 172 H 142"/><path d="M 194 216 H 220"/>
    <path d="M 162 260 H 196"/><path d="M 284 260 H 334"/>
    <path d="M 204 420 H 232"/><path d="M 162 464 H 196"/><path d="M 284 464 H 334"/>
    <path d="M 162 608 H 196"/><path d="M 284 608 H 334"/>
  </g>
  <g aria-hidden="true" fill="none" stroke="#39766a" stroke-width="1.5" marker-end="url(#kv-reuse-mobile-arrow)">
    <path d="M 422 172 H 438 V 196 H 104 V 204"/>
    <path d="M 414 216 H 438 V 240 H 94 V 248"/>
    <path d="M 416 420 H 438 V 444 H 94 V 452"/>
  </g>
</svg>
